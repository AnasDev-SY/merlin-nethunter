name: Build NetHunter Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex texinfo libssl-dev libelf-dev libncurses-dev git zip unzip clang lld ccache

    - name: Clone Kernel Source & Toolchain
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b merlin-r-oss kernel
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master --depth=1 clang

    - name: Configure and Enable NetHunter Features
      run: |
        cd kernel
        export ARCH=arm64
        make merlin_defconfig
        echo "CONFIG_WIRELESS=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_CFG80211=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_MAC80211=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_NL80211_TESTMODE=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/merlin_defconfig
        make merlin_defconfig

    - name: Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GITHUB_WORKSPACE/clang/clang-r487747c/bin:$PATH
        make -j$(nproc --all) \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package Kernel (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        if [ -f kernel/arch/arm64/boot/Image.gz-dtb ]; then
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        elif [ -f kernel/arch/arm64/boot/Image ]; then
          cp kernel/arch/arm64/boot/Image AnyKernel3/
        fi
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../NetHunter-Kernel-Merlin.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Merlin
        path: NetHunter-Kernel-Merlin.zip
