name: Build NetHunter Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cache APT Packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/.github/workflows/*.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex texinfo libssl-dev libelf-dev libncurses-dev git zip unzip clang lld ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu cpio

    - name: Cache Kernel Source
      id: cache-kernel
      uses: actions/cache@v4
      with:
        path: kernel
        key: ${{ runner.os }}-kernel-merlin-v4

    - name: Clone Kernel Source
      if: steps.cache-kernel.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b merlin-r-oss kernel

    - name: Configure and Enable NetHunter Features
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # تهيئة افتراضية لملف الإعدادات
        make merlin_defconfig
        
        # حقن ميزات NetHunter
        echo "CONFIG_WIRELESS=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_CFG80211=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_MAC80211=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_NL80211_TESTMODE=y" >> arch/arm64/configs/merlin_defconfig
        echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/merlin_defconfig
        
        # كسر حماية المكدس (Stack Protector)
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/merlin_defconfig
        sed -i 's/select CC_STACKPROTECTOR_STRONG//g' arch/arm64/Kconfig
        sed -i 's/cc-option,-fstack-protector-strong/cc-option,-fstack-protector/g' Makefile
        
        # الحل الجذري والنهائي لمشكلة cpio و kheaders: تفريغ السكربت بالكامل!
        echo "#!/bin/bash" > kernel/gen_kheaders.sh
        echo "exit 0" >> kernel/gen_kheaders.sh
        chmod +x kernel/gen_kheaders.sh
        
        # حذف فرض ميزة kheaders من الملفات لتأكيد الإيقاف
        find . -name "Kconfig*" -exec sed -i 's/select IKHEADERS//g' {} +
        sed -i 's/CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/g' arch/arm64/configs/merlin_defconfig

        # إعادة تطبيق الإعدادات وتوليد ملف الـ .config الفعلي
        make merlin_defconfig
        
        # التأكيد الأخير للإيقاف قبل البناء
        sed -i 's/CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/g' .config

    - name: Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export LD=aarch64-linux-gnu-ld.bfd

        # بدء عملية البناء الفورية
        make -j$(nproc --all)

    - name: Package Kernel (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        if [ -f kernel/arch/arm64/boot/Image.gz-dtb ]; then
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        elif [ -f kernel/arch/arm64/boot/Image ]; then
          cp kernel/arch/arm64/boot/Image AnyKernel3/
        fi
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 ../NetHunter-Kernel-Merlin.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Merlin
        path: NetHunter-Kernel-Merlin.zip
